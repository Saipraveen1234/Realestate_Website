<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Soudha Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50" style="font-family: 'Outfit', sans-serif;">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white shadow-xl w-full max-w-md overflow-hidden">
            <!-- Brand header strip -->
            <div class="px-8 pt-10 pb-8 border-b border-gray-100 flex flex-col items-center text-center">
                <img src="../frontend/assets/images/logo.svg" alt="Soudha Projects"
                    class="h-12 w-auto max-w-[200px] object-contain mb-6">
                <p class="text-xs text-gray-400 uppercase tracking-widest">Admin Panel</p>
            </div>

            <form id="login-form" class="px-8 py-8">
                <div class="mb-6">
                    <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2" for="email">Email</label>
                    <input type="email" id="email" required
                        class="w-full border-0 border-b border-gray-200 py-2 text-gray-800 text-sm focus:outline-none focus:border-[#ef7d50] transition-colors"
                        placeholder="admin@realestate.com">
                </div>

                <div class="mb-8">
                    <label class="block text-xs text-gray-400 uppercase tracking-widest mb-2" for="password">Password</label>
                    <input type="password" id="password" required
                        class="w-full border-0 border-b border-gray-200 py-2 text-gray-800 text-sm focus:outline-none focus:border-[#ef7d50] transition-colors"
                        placeholder="••••••••">
                </div>

                <div id="error-message" class="mb-4 text-red-500 text-xs hidden"></div>

                <button type="submit"
                    class="w-full text-white py-3 text-xs uppercase tracking-widest font-semibold transition-colors duration-300"
                    style="background:#ef7d50;"
                    onmouseover="this.style.background='#d9653a'"
                    onmouseout="this.style.background='#ef7d50'">
                    <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect to dashboard
                    window.location.href = '/admin/dashboard';
                } else {
                    errorMessage.textContent = data.message || 'Login failed';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
